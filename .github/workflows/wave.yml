name: generate-wave

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_wave.py"
      - ".github/workflows/wave.yml"

jobs:
  wave:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: generate
        run: python scripts/gen_wave.py
      - name: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "wave: regenerate random gradient"
          file_pattern: "assets/wave-*.svg"
